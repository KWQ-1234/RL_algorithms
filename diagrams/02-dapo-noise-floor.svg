<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="system-ui, -apple-system, sans-serif">
  <title>DAPO's cumulative ablation against the evaluation noise floor</title>
  <desc>Five increments from DAPO's cumulative ablation on AIME 2024 (overlong filtering +6, clip-higher +2, soft overlong punishment +3, token-level loss +1, dynamic sampling +8) plotted against a shaded band of plus or minus 4.6 points, the two-sigma upper bound on evaluation-sampling noise for a difference of two scores at 32 samples per problem.</desc>

  <rect width="760" height="380" fill="#ffffff"/>
  <text x="380" y="32" text-anchor="middle" font-size="22.8" font-weight="600" fill="#18202e">Which DAPO increments clear the evaluation noise?</text>
  <text x="380" y="54" text-anchor="middle" font-size="16.2" fill="#5a6070">AIME 2024 avg@32, Qwen2.5-32B; no seeds or error bars reported</text>

  <!-- Plot: x0 (0 pts) at 470; 25 px per point; range -6..+10 -->
  <!-- Noise band: +/-4.6 pts -->
  <rect x="355" y="74" width="230" height="212" fill="#f1f2f5"/>
  <line x1="470" y1="74" x2="470" y2="286" stroke="#8a8f9c" stroke-width="1.2"/>
  <line x1="355" y1="74" x2="355" y2="286" stroke="#c9ccd4" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="585" y1="74" x2="585" y2="286" stroke="#c9ccd4" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- Rows -->
  <g font-size="16.8" fill="#18202e">
    <text x="20" y="100">+ Overlong filtering</text>
    <text x="20" y="140">+ Clip-higher</text>
    <text x="20" y="180">+ Soft overlong punishment</text>
    <text x="20" y="220">+ Token-level loss</text>
    <text x="20" y="260">+ Dynamic sampling</text>
  </g>
  <g font-size="15.0" fill="#8a8f9c" text-anchor="end">
    <text x="340" y="100">30 → 36</text>
    <text x="340" y="140">36 → 38</text>
    <text x="340" y="180">38 → 41</text>
    <text x="340" y="220">41 → 42</text>
    <text x="340" y="260">42 → 50</text>
  </g>

  <rect x="470" y="85" width="150" height="22" rx="3" fill="#4f4a9c"/>
  <rect x="470" y="125" width="50" height="22" rx="3" fill="#b4b9c4"/>
  <rect x="470" y="165" width="75" height="22" rx="3" fill="#b4b9c4"/>
  <rect x="470" y="205" width="25" height="22" rx="3" fill="#b4b9c4"/>
  <rect x="470" y="245" width="200" height="22" rx="3" fill="#4f4a9c"/>

  <g font-size="16.2" font-weight="600">
    <text x="628" y="101" fill="#423d88">+6</text>
    <text x="528" y="141" fill="#5a6070">+2</text>
    <text x="553" y="181" fill="#5a6070">+3</text>
    <text x="503" y="221" fill="#5a6070">+1</text>
    <text x="678" y="261" fill="#423d88">+8</text>
  </g>

  <!-- Axis -->
  <line x1="320" y1="286" x2="720" y2="286" stroke="#5a6070" stroke-width="1"/>
  <g font-size="14.4" fill="#5a6070" text-anchor="middle">
    <line x1="370" y1="286" x2="370" y2="291" stroke="#5a6070"/><text x="370" y="305">−4</text>
    <line x1="470" y1="286" x2="470" y2="291" stroke="#5a6070"/><text x="470" y="305">0</text>
    <line x1="570" y1="286" x2="570" y2="291" stroke="#5a6070"/><text x="570" y="305">+4</text>
    <line x1="670" y1="286" x2="670" y2="291" stroke="#5a6070"/><text x="670" y="305">+8</text>
    <text x="520" y="324">increment over the previous row (AIME points)</text>
  </g>

  <!-- Legend -->
  <rect x="20" y="341" width="16" height="14" fill="#f1f2f5" stroke="#c9ccd4"/>
  <text x="44" y="354" font-size="15.0" fill="#5a6070">±4.6 pts: 2σ upper bound on evaluation noise of a difference at k = 32</text>
  <text x="20" y="372" font-size="15.0" fill="#a35a12">Training-seed variance would widen the band; it is not reported.</text>
</svg>
