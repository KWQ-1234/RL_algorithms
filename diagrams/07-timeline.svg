<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" font-family="system-ui, -apple-system, sans-serif">
  <title>Two bands of LLM RL algorithm development, 2017 to 2026</title>
  <desc>Timeline in two bands. The advantage-estimator band simplifies from a learned critic to group baselines to mean-only baselines. The trust-region, importance-sampling and numerics band grows more crowded from 2025 onward, with clip-higher, CISPO, GSPO, truncated importance sampling, routing replay, FP16, IcePop, SAPO, sequence masking and zero-mismatch engines. Hollow markers are 2026 measurement studies.</desc>
  <rect width="760" height="600" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-size="20" font-weight="600" fill="#18202e">Estimators got simpler; the trust region got crowded</text>
  <text x="380" y="52" text-anchor="middle" font-size="13.5" fill="#5a6070">Time axis compressed before 2024. Hollow markers: 2026 measurement studies.</text>
  <line x1="60" y1="250" x2="730" y2="250" stroke="#2a5da8" stroke-width="2.4"/>
  <text x="60" y="276" font-size="14" font-weight="600" fill="#2a5da8">Advantage estimator</text>
  <line x1="81.8" y1="250" x2="81.8" y2="230" stroke="#c9ccd4" stroke-width="1"/>
  <circle cx="81.8" cy="250" r="5.5" fill="#2a5da8" stroke="#2a5da8" stroke-width="2"/>
  <text x="84.8" y="226" font-size="13" fill="#18202e" transform="rotate(-62 84.8 226)">PPO + GAE critic</text>
  <line x1="215.7" y1="250" x2="215.7" y2="230" stroke="#c9ccd4" stroke-width="1"/>
  <circle cx="215.7" cy="250" r="5.5" fill="#2a5da8" stroke="#2a5da8" stroke-width="2"/>
  <text x="218.7" y="226" font-size="13" fill="#18202e" transform="rotate(-62 218.7 226)">ReMax: greedy baseline</text>
  <line x1="237.2" y1="250" x2="246.7" y2="230" stroke="#c9ccd4" stroke-width="1"/>
  <circle cx="237.2" cy="250" r="5.5" fill="#2a5da8" stroke="#2a5da8" stroke-width="2"/>
  <text x="249.7" y="226" font-size="13" fill="#18202e" transform="rotate(-62 249.7 226)">GRPO, RLOO: group baselines</text>
  <line x1="397.6" y1="250" x2="397.6" y2="230" stroke="#c9ccd4" stroke-width="1"/>
  <circle cx="397.6" cy="250" r="5.5" fill="#2a5da8" stroke="#2a5da8" stroke-width="2"/>
  <text x="400.6" y="226" font-size="13" fill="#18202e" transform="rotate(-62 400.6 226)">REINFORCE++: batch norm</text>
  <line x1="430.3" y1="250" x2="430.3" y2="230" stroke="#c9ccd4" stroke-width="1"/>
  <circle cx="430.3" cy="250" r="5.5" fill="#2a5da8" stroke="#2a5da8" stroke-width="2"/>
  <text x="433.3" y="226" font-size="13" fill="#18202e" transform="rotate(-62 433.3 226)">Dr. GRPO: mean only</text>
  <line x1="444.1" y1="250" x2="461.3" y2="230" stroke="#c9ccd4" stroke-width="1"/>
  <circle cx="444.1" cy="250" r="5.5" fill="#2a5da8" stroke="#2a5da8" stroke-width="2"/>
  <text x="464.3" y="226" font-size="13" fill="#18202e" transform="rotate(-62 464.3 226)">VAPO: critic returns</text>
  <line x1="556.2" y1="250" x2="556.2" y2="230" stroke="#c9ccd4" stroke-width="1"/>
  <circle cx="556.2" cy="250" r="5.5" fill="#2a5da8" stroke="#2a5da8" stroke-width="2"/>
  <text x="559.2" y="226" font-size="13" fill="#18202e" transform="rotate(-62 559.2 226)">OLMo 3, V3.2: no std</text>
  <line x1="613.1" y1="250" x2="613.1" y2="230" stroke="#c9ccd4" stroke-width="1"/>
  <circle cx="613.1" cy="250" r="5.5" fill="#ffffff" stroke="#2a5da8" stroke-width="2"/>
  <text x="616.1" y="226" font-size="13" fill="#18202e" transform="rotate(-62 616.1 226)">GenAC: estimators tie</text>
  <line x1="60" y1="520" x2="730" y2="520" stroke="#4f4a9c" stroke-width="2.4"/>
  <text x="60" y="546" font-size="14" font-weight="600" fill="#4f4a9c">Trust region · importance sampling · numerics</text>
