  <text x="486.0" y="496" font-size="13" fill="#18202e" transform="rotate(-62 486.0 496)">GSPO sequence ratio</text>
  <line x1="499.3" y1="520" x2="514.0" y2="500" stroke="#c9ccd4" stroke-width="1"/>
  <circle cx="499.3" cy="520" r="5.5" fill="#4f4a9c" stroke="#4f4a9c" stroke-width="2"/>
  <text x="517.0" y="496" font-size="13" fill="#18202e" transform="rotate(-62 517.0 496)">TIS (sampler ratio)</text>
  <line x1="526.9" y1="520" x2="545.0" y2="500" stroke="#c9ccd4" stroke-width="1"/>
  <circle cx="526.9" cy="520" r="5.5" fill="#4f4a9c" stroke="#4f4a9c" stroke-width="2"/>
