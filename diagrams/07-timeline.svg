  <line x1="552.8" y1="520" x2="638.0" y2="500" stroke="#c9ccd4" stroke-width="1"/>
  <circle cx="552.8" cy="520" r="5.5" fill="#4f4a9c" stroke="#4f4a9c" stroke-width="2"/>
  <text x="641.0" y="496" font-size="13" fill="#18202e" transform="rotate(-62 641.0 496)">V3.2 sequence masking</text>
  <line x1="628.6" y1="520" x2="669.0" y2="500" stroke="#c9ccd4" stroke-width="1"/>
  <circle cx="628.6" cy="520" r="5.5" fill="#ffffff" stroke="#4f4a9c" stroke-width="2"/>
  <text x="672.0" y="496" font-size="13" fill="#18202e" transform="rotate(-62 672.0 496)">VeXact zero mismatch</text>
  <line x1="685.5" y1="520" x2="700.0" y2="500" stroke="#c9ccd4" stroke-width="1"/>
  <circle cx="685.5" cy="520" r="5.5" fill="#ffffff" stroke="#4f4a9c" stroke-width="2"/>
  <text x="703.0" y="496" font-size="13" fill="#18202e" transform="rotate(-62 703.0 496)">CIS multi-seed test</text>
  <line x1="70.0" y1="560" x2="70.0" y2="567" stroke="#8a8f9c"/>
  <text x="70.0" y="585" text-anchor="middle" font-size="13" fill="#5a6070">2017</text>
  <line x1="134.3" y1="560" x2="134.3" y2="567" stroke="#8a8f9c"/>
  <text x="134.3" y="585" text-anchor="middle" font-size="13" fill="#5a6070">2020</text>
  <line x1="220.0" y1="560" x2="220.0" y2="567" stroke="#8a8f9c"/>
  <text x="220.0" y="585" text-anchor="middle" font-size="13" fill="#5a6070">2024</text>
  <line x1="392.4" y1="560" x2="392.4" y2="567" stroke="#8a8f9c"/>
