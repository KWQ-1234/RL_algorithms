<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="system-ui, -apple-system, sans-serif">
  <title>Two gaps, two ratios</title>
  <desc>Three policies in one update: the sampler that generated the tokens, the trainer's copy at the behavior parameters, and the trainer's current policy. The first gap, between sampler and trainer at the same parameters, comes from numerical mismatch and routing flips and is seen only by corrections that read the sampler's probabilities. The second gap, between the behavior parameters and the current parameters, comes from multiple steps per batch and asynchrony and is seen by the PPO ratio.</desc>

  <defs>
    <marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c5962"/>
    </marker>
  </defs>

  <rect width="760" height="400" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-size="22.4" font-weight="600" fill="#27262b">Two gaps, two ratios</text>
  <text x="380" y="53" text-anchor="middle" font-size="15.7" fill="#5c5962">The policy that generated a token and the policy being trained differ in two separate ways.</text>

  <!-- Boxes -->
  <g text-anchor="middle">
    <rect x="20" y="78" width="210" height="92" rx="8" fill="#eef4ff" stroke="#2869e6" stroke-width="1.8"/>
    <text x="125" y="106" font-size="17.9" font-weight="600" fill="#27262b">π<tspan font-size="12.3" dy="4">sampler</tspan><tspan dy="-4">(θ</tspan><tspan font-size="12.3" dy="4">behav</tspan><tspan dy="-4">)</tspan></text>
    <text x="125" y="130" font-size="14.6" fill="#2869e6">inference engine</text>
    <text x="125" y="150" font-size="14.0" fill="#5c5962">generated the tokens</text>

    <rect x="275" y="78" width="210" height="92" rx="8" fill="#f5f2ff" stroke="#7253ed" stroke-width="1.8"/>
    <text x="380" y="106" font-size="17.9" font-weight="600" fill="#27262b">π<tspan font-size="12.3" dy="4">old</tspan><tspan dy="-4"> = π</tspan><tspan font-size="12.3" dy="4">learner</tspan><tspan dy="-4">(θ</tspan><tspan font-size="12.3" dy="4">behav</tspan><tspan dy="-4">)</tspan></text>
    <text x="380" y="130" font-size="14.6" fill="#5f3ceb">training engine, recomputed</text>
    <text x="380" y="150" font-size="14.0" fill="#5c5962">same weights, other kernels</text>

    <rect x="530" y="78" width="210" height="92" rx="8" fill="#f5f2ff" stroke="#7253ed" stroke-width="1.8"/>
    <text x="635" y="106" font-size="17.9" font-weight="600" fill="#27262b">π<tspan font-size="12.3" dy="4">θ</tspan></text>
    <text x="635" y="130" font-size="14.6" fill="#5f3ceb">training engine, current</text>
    <text x="635" y="150" font-size="14.0" fill="#5c5962">the policy being optimized</text>
  </g>
  <g stroke="#5c5962" stroke-width="1.6" fill="none" marker-end="url(#a6)">
    <line x1="230" y1="124" x2="272" y2="124"/>
    <line x1="485" y1="124" x2="527" y2="124"/>
  </g>

  <!-- Braces -->
  <path d="M 125 182 V 194 H 380 V 182" stroke="#b85c00" stroke-width="1.6" fill="none"/>
  <path d="M 380 200 V 212 H 635 V 200" stroke="#026e57" stroke-width="1.6" fill="none"/>

  <!-- Gap 1 -->
  <g font-size="14.6" fill="#27262b">
    <text x="20" y="232" font-size="16.2" font-weight="600" fill="#b85c00">Gap 1 · ratio π<tspan font-size="11.2" dy="4">old</tspan><tspan dy="-4"> / π</tspan><tspan font-size="11.2" dy="4">sampler</tspan></text>
    <text x="20" y="256"><tspan font-weight="600">Sources:</tspan> precision, kernel reduction</text>
    <text x="20" y="274">order, MoE routing flips, top-p truncation</text>
    <text x="20" y="298"><tspan font-weight="600">Seen by:</tspan> only corrections that read</text>
    <text x="20" y="316">π<tspan font-size="11.2" dy="4">sampler</tspan><tspan dy="-4">: TIS, MIS, IcePop, CIS, geo masks</tspan></text>
    <text x="20" y="340"><tspan font-weight="600">Removed by:</tspan> FP16, batch-invariant</text>
    <text x="20" y="358">kernels, rollout routing replay (R3)</text>
  </g>

  <!-- Gap 2 -->
  <g font-size="14.6" fill="#27262b">
    <text x="400" y="250" font-size="16.2" font-weight="600" fill="#026e57">Gap 2 · ratio π<tspan font-size="11.2" dy="4">θ</tspan><tspan dy="-4"> / π</tspan><tspan font-size="11.2" dy="4">old</tspan></text>
    <text x="400" y="274"><tspan font-weight="600">Sources:</tspan> more than one optimizer step</text>
    <text x="400" y="292">per batch; asynchronous policy versions;</text>
    <text x="400" y="310">MoE routing drift across updates</text>
    <text x="400" y="334"><tspan font-weight="600">Seen by:</tspan> PPO-clip and its variants,</text>
    <text x="400" y="352">decoupled PPO, M2PO</text>
    <text x="400" y="376"><tspan font-weight="600">Bounded by:</tspan> fewer steps; staleness × LR;</text>
    <text x="400" y="394">routing replay (R2) for MoE</text>
  </g>
</svg>
