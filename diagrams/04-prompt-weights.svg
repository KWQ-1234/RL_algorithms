<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="system-ui, -apple-system, sans-serif">
  <title>Implicit per-prompt weight of four advantage rules</title>
  <desc>Relative weight w(p) that each advantage normalization gives a prompt with pass rate p, normalized to 1 at p = 0.5, on a log scale. RLOO and Dr. GRPO weight all prompts equally; GRPO up-weights both hard and easy prompts symmetrically; a scale proportional to p up-weights hard prompts only; pass@8 up-weights hard prompts strongly and nearly ignores easy ones.</desc>
  <rect width="760" height="470" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-size="20" font-weight="600" fill="#27262b">Which prompts each normalization favours</text>
  <text x="380" y="53" text-anchor="middle" font-size="14" fill="#5c5962">Relative weight w(p) on a prompt with pass rate p, scaled so that w(0.5) = 1</text>
  <rect x="570.0" y="70" width="120.0" height="280" fill="#fde8e8" opacity="0.7"/>
  <text x="630.0" y="338" text-anchor="middle" font-size="13" fill="#b42318">easy prompts</text>
  <rect x="90.0" y="70" width="120.0" height="280" fill="#eef4ff" opacity="0.8"/>
  <text x="150.0" y="338" text-anchor="middle" font-size="13" fill="#2869e6">hard prompts</text>
