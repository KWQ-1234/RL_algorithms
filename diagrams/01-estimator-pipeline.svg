<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 580" font-family="system-ui, -apple-system, sans-serif">
  <title>One policy-gradient update in seven steps</title>
  <desc>Seven steps of one update arranged as a loop (sample, score, baseline, weight and mask, aggregate, regularize, step), each labelled with the design axes it decides, above the single gradient estimator whose three knobs (normalizer, surrogate weight and mask, advantage) they set.</desc>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f4a9c"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a35a12"/>
    </marker>
  </defs>

  <rect width="760" height="580" fill="#ffffff"/>

  <text x="380" y="34" text-anchor="middle" font-size="21" font-weight="600" fill="#18202e">One update, seven steps</text>
  <text x="380" y="58" text-anchor="middle" font-size="14" fill="#5a6070">Each step maps to a coordinate in the Two-Layer Sufficiency System (Target A · Regime B · Approximation C).</text>

  <!-- Seven step boxes: row 1 left to right (1-4), row 2 right to left (5-7) -->
  <g text-anchor="middle" font-size="14" fill="#18202e">
    <rect x="20" y="84" width="160" height="124" rx="8" fill="#fff" stroke="#2a5da8" stroke-width="1.8"/>
    <text x="100" y="111" font-size="16" font-weight="600">1 · Sample</text>
    <text x="100" y="138">y ~ π<tspan font-size="10" dy="4">sampler</tspan><tspan dy="-4"></tspan></text>
    <text x="100" y="160" font-size="12.5" fill="#5a6070">G responses per prompt</text>
    <text x="100" y="192" font-size="14" font-weight="600" fill="#a35a12">Cond · B1 · D2</text>
    <rect x="202" y="84" width="160" height="124" rx="8" fill="#fff" stroke="#b08a1e" stroke-width="1.8"/>
    <text x="282" y="111" font-size="16" font-weight="600">2 · Score</text>
    <text x="282" y="138">r = R(x, y)</text>
    <text x="282" y="160" font-size="12.5" fill="#5a6070">verifier, RM, or judge</text>
    <text x="282" y="192" font-size="14" font-weight="600" fill="#a35a12">A1 (Signal)</text>
    <rect x="384" y="84" width="160" height="124" rx="8" fill="#fff" stroke="#2a5da8" stroke-width="1.8"/>
    <text x="464" y="111" font-size="16" font-weight="600">3 · Baseline</text>
    <text x="464" y="138">Â = (r − b) / s</text>
    <text x="464" y="160" font-size="12.5" fill="#5a6070">b (credit), s (F(p) weight)</text>
    <text x="464" y="192" font-size="14" font-weight="600" fill="#a35a12">C2 (b) · A2 (s)</text>
    <rect x="566" y="84" width="160" height="124" rx="8" fill="#fff" stroke="#4f4a9c" stroke-width="1.8"/>
    <text x="646" y="111" font-size="16" font-weight="600">4 · Weight, mask</text>
    <text x="646" y="138">w, m from π<tspan font-size="10" dy="4">θ</tspan><tspan dy="-4"> / π</tspan><tspan font-size="10" dy="4">old</tspan><tspan dy="-4"></tspan></text>
    <text x="646" y="160" font-size="12.5" fill="#5a6070">4-quadrant ratio gate</text>
    <text x="646" y="192" font-size="14" font-weight="600" fill="#a35a12">C1 (iff B1 ≠ on-pol)</text>
    <rect x="566" y="250" width="160" height="124" rx="8" fill="#fff" stroke="#2f6b4f" stroke-width="1.8"/>
    <text x="646" y="277" font-size="16" font-weight="600">5 · Aggregate</text>
    <text x="646" y="304">normalizer c</text>
    <text x="646" y="326" font-size="12.5" fill="#5a6070">token, seq 1/|y|, or 1/M</text>
    <text x="646" y="358" font-size="14" font-weight="600" fill="#a35a12">A3 (Length Weight)</text>
    <rect x="384" y="250" width="160" height="124" rx="8" fill="#fff" stroke="#8a8f9c" stroke-width="1.8"/>
    <text x="464" y="277" font-size="16" font-weight="600">6 · Regularize</text>
    <text x="464" y="304">KL, entropy</text>
    <text x="464" y="326" font-size="12.5" fill="#5a6070">anchor or proximal</text>
    <text x="464" y="358" font-size="14" font-weight="600" fill="#a35a12">A4 (Regularizer)</text>
    <rect x="202" y="250" width="160" height="124" rx="8" fill="#fff" stroke="#8a8f9c" stroke-width="1.8"/>
    <text x="282" y="277" font-size="16" font-weight="600">7 · Step</text>
    <text x="282" y="304">μ steps · KL step</text>
    <text x="282" y="326" font-size="12.5" fill="#5a6070">μ=1 keeps r≡1 (C1=∅)</text>
    <text x="282" y="358" font-size="14" font-weight="600" fill="#a35a12">B1 (μ, τ) · C3</text>
  </g>

  <!-- Flow arrows -->
  <g stroke="#4f4a9c" stroke-width="1.8" fill="none" marker-end="url(#arr)">
    <line x1="180" y1="146" x2="199" y2="146"/>
    <line x1="362" y1="146" x2="381" y2="146"/>
    <line x1="544" y1="146" x2="563" y2="146"/>
    <line x1="646" y1="208" x2="646" y2="247"/>
    <line x1="566" y1="312" x2="547" y2="312"/>
    <line x1="384" y1="312" x2="365" y2="312"/>
  </g>

  <!-- Loop back to the next batch -->
  <path d="M 202 312 H 100 V 211" stroke="#a35a12" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#arro)"/>
  <g font-size="12.5" fill="#a35a12">
    <text x="20" y="338">Next batch: r ≠ 1 if the batch</text>
    <text x="20" y="356">gets &gt;1 step, weights are</text>
    <text x="20" y="374">stale, or π<tspan font-size="9.5" dy="3">old</tspan><tspan dy="-3"> comes from</tspan></text>
    <text x="20" y="392">the sampler</text>
  </g>

  <!-- Estimator panel -->
  <rect x="20" y="418" width="706" height="144" rx="9" fill="#f7f8fa" stroke="#d8dbe1"/>
  <text x="373" y="446" text-anchor="middle" font-size="14" fill="#5a6070">The update every method computes</text>
  <text x="373" y="494" text-anchor="middle" font-size="25" fill="#18202e" font-family="Charter, Georgia, serif">g = Σ<tspan font-size="15" dy="7">i</tspan><tspan dy="-7"> Σ</tspan><tspan font-size="15" dy="7">t</tspan><tspan dy="-7"> </tspan><tspan fill="#2f6b4f" font-weight="700">c</tspan><tspan font-size="15" fill="#2f6b4f" dy="7">i,t</tspan><tspan dy="-7"> · </tspan><tspan fill="#4f4a9c" font-weight="700">w</tspan><tspan font-size="15" fill="#4f4a9c" dy="7">i,t</tspan><tspan dy="-7"> · </tspan><tspan fill="#4f4a9c" font-weight="700">m</tspan><tspan font-size="15" fill="#4f4a9c" dy="7">i,t</tspan><tspan dy="-7"> · </tspan><tspan fill="#2a5da8" font-weight="700">Â</tspan><tspan font-size="15" fill="#2a5da8" dy="7">i</tspan><tspan dy="-7"> · ∇ log π</tspan><tspan font-size="15" dy="7">θ</tspan><tspan dy="-7">(y</tspan><tspan font-size="15" dy="7">i,t</tspan><tspan dy="-7">)</tspan></text>
  <g font-size="13.5" text-anchor="middle">
    <text x="170" y="538" fill="#2f6b4f">c · normalizer · step 5</text>
    <text x="388" y="538" fill="#4f4a9c">w, m · surrogate · step 4</text>
    <text x="602" y="538" fill="#2a5da8">Â · advantage · step 3</text>
  </g>
</svg>
